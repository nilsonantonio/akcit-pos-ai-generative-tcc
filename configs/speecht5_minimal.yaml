project:
  name: tcc_audio_ptbr_speecht5_minimal
  seed: 42
  execution_window_weeks: 4
  team_mode: dupla
  compute_target: runpod_docker
  primary_model: microsoft/speecht5_tts
  vocoder_model: microsoft/speecht5_hifigan
  tts_speaker_embedding_model: speechbrain/spkrec-xvect-voxceleb
  tts_speaker_embedding_dim: 512

data:
  adaptation_dataset: common_voice_pt
  contextual_dataset: brspeech_df
  speaker_target_count: 4
  minutes_per_speaker: 20
  sample_rate: 16000
  reference_clip_len_s:
    min: 3
    max: 10
  prompts_path: data/prompts/ptbr_test_prompts.csv
  manifest_path: data/manifests/data_manifest.csv
  speaker_selection_path: data/manifests/speaker_selection.csv
  speaker_embeddings_index: artifacts/embeddings/speaker_embeddings.csv

conditions:
  - id: speecht5_lora_conservative
    label: SpeechT5 LoRA Conservative
    regime: light_finetune
    model_name: microsoft/speecht5_tts
    trainable: true
    minutes_per_speaker: 20
    train_strategy: lora
    uses_speaker_embeddings: true
    normalization_modes: [normalized]
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      bias: none
      target_modules: [q_proj, k_proj, v_proj, out_proj]
      init_lora_weights: true
      use_rslora: false
    training:
      scope: per_speaker
      max_steps: 1500
      learning_rate: 3.0e-5
      warmup_ratio: 0.05
      lr_scheduler_type: cosine
      per_device_train_batch_size: 2
      gradient_accumulation_steps: 2
      effective_batch_size: 4
      per_device_eval_batch_size: 2
      fp16: false
      gradient_checkpointing: true
      max_grad_norm: 1.0
      weight_decay: 0.01
      evaluation_strategy: steps
      eval_steps: 500
      save_strategy: steps
      save_steps: 500
      save_total_limit: 3
      logging_strategy: steps
      logging_steps: 50
      load_best_model_at_end: true
      metric_for_best_model: eval_loss
      greater_is_better: false
  - id: speecht5_lora_unique
    label: SpeechT5 LoRA Unique
    regime: light_finetune
    model_name: microsoft/speecht5_tts
    trainable: true
    minutes_per_speaker: 20
    train_strategy: lora
    uses_speaker_embeddings: true
    normalization_modes: [normalized]
    lora:
      r: 8
      lora_alpha: 16
      lora_dropout: 0.05
      bias: none
      target_modules: [q_proj, k_proj, v_proj, out_proj]
      init_lora_weights: true
      use_rslora: false
    training:
      scope: unique
      max_steps: 1000
      learning_rate: 5.0e-5
      warmup_ratio: 0.05
      lr_scheduler_type: cosine
      per_device_train_batch_size: 2
      gradient_accumulation_steps: 2
      effective_batch_size: 4
      per_device_eval_batch_size: 2
      fp16: false
      gradient_checkpointing: false
      max_grad_norm: 1.0
      weight_decay: 0.01
      evaluation_strategy: steps
      eval_steps: 500
      save_strategy: steps
      save_steps: 500
      save_total_limit: 3
      logging_strategy: steps
      logging_steps: 50
      load_best_model_at_end: true
      metric_for_best_model: eval_loss
      greater_is_better: false

evaluation:
  speaker_similarity_model: speechbrain/spkrec-ecapa-voxceleb
  asr:
    name: openai/whisper-small
    finetuned: false
  automatic_metrics:
    - wer
    - speaker_similarity
    - nisqa
    - f0_rmse
    - rtf
    - train_gpu_hours
    - inference_seconds
    - cost_usd
  statistics:
    paired_test: wilcoxon
    confidence_interval: bootstrap
    bootstrap_iterations: 2000

deliverables:
  run_matrix: artifacts/run_matrix.csv
  samples: artifacts/evaluation/samples.csv
  metrics_summary: artifacts/evaluation/metrics_summary.csv
  cost_summary: artifacts/evaluation/cost_summary.csv
  report_assets_dir: report_assets
  demo_dir: demo
