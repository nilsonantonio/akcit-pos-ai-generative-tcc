[project]
name = "tcc-audio-execution"
version = "0.1.0"
description = "Execution scaffold for a Brazilian Portuguese generative audio TCC experiment."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
demo = ["gradio>=4.0"]
dev = ["pytest>=8.0"]
report = ["matplotlib>=3.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
